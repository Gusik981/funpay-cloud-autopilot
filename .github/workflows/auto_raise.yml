name: FunPay 24/7 Immortal Cloud Relay & Telegram Poster

on:
  schedule:
    # Страховочный таймер
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: funpay-autopilot-relay
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  immortal-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 24/7 Immortal FunPay & Telegram Bot
        env:
          GOLDEN_KEY: ${{ secrets.GOLDEN_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python runner.py
