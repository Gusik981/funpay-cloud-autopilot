name: FunPay 24/7 Immortal Cloud Relay

on:
  schedule:
    # Защитный таймер: каждые 4 часа проверяет, что эстафета активна
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  immortal-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 24/7 Immortal Bot Loop
        env:
          GOLDEN_KEY: ${{ secrets.GOLDEN_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python runner.py
